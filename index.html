<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Lesson Studio</title>
    <style>
       html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden; /* スクロールなし */
            background-color: #121214;
            color: #e0e0e0;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        body {
            /* Google TV Safe Area Margin (左右 48px, 上下 36px) */
            padding: 36px 48px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            gap: 16px;
        }
        
        /* 動画ID入力エリア */
        .input-container {
            width: 100%;
            display: flex;
            gap: 12px;
            background: #1a1a1e;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #2d2d34;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .input-container input {
            flex: 1;
            padding: 10px 14px;
            font-size: 15px;
            background-color: #0d0d0f;
            border: 1px solid #3a3a45;
            border-radius: 6px;
            color: #00ffcc;
            font-family: inherit;
        }
        .input-container input:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 8px rgba(0,255,204,0.3);
        }
        .input-container button {
            padding: 10px 24px;
            font-size: 15px;
            background-color: #B40000;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .input-container button:hover {
            background-color: #FF0000;
        }
        
        /* プレイヤー＆Webカメラ メイン領域 */
        .stage-wrapper {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 16px;
            align-items: stretch;
        }

        /* 縦並びの各カラム（動画側・カメラ側） */
        .stage-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .stage-column.video-column {
            flex: 1;
            min-width: 0;
        }

        .stage-column.camera-column {
            width: 840px; /* 前回の840px指定を維持 */
            max-width: 45vw;
            flex-shrink: 0;
        }

        /* プレイヤーのラッパー */
        .video-container {
            width: 100%;
            flex: 1;
            position: relative;
            background-color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 1px #00ffcc;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #2d2d34;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .no-video-message {
            color: #555;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
            text-align: center;
        }
        
        #player, #player iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: opacity 0.05s linear;
        }

        /* Webカメラプレビュー領域 */
        .camera-container {
            width: 100%;
            flex: 1;
            background-color: #050507;
            border: 3px solid #2d2d34;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 1px #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .camera-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: none;
        }

        .camera-overlay {
            color: #666;
            font-size: 15px;
            text-align: center;
            padding: 10px;
            user-select: none;
            transition: color 0.2s;
        }

        /* ★コントロールパネル（グレー背景を撤去し、センター合わせで並べる） */
        .controls {
            width: 100%;
            padding: 4px 0;
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        
        /* 共通ボタン（フットスイッチ風） */
        .btn {
            width: 140px;
            height: 60px;
            padding: 0;
            font-size: 14px;
            color: #bbb;
            letter-spacing: 1px;
            font-weight: bold;
            font-family: inherit;
            background: linear-gradient(180deg, #3a3a45 0%, #25252c 100%);
            border: 1px solid #4a4a57;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.1s ease;
            user-select: none;
            text-transform: uppercase;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            line-height: 1.4;
            outline: none;
        }
        .btn:focus { outline: none; }
        .btn:hover {
            color: #ddd;
            background: linear-gradient(180deg, #454552 0%, #2d2d36 100%);
        }
        .btn-status {
            font-size: 12px;
            margin-top: 2px;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* カラー設定 */
        .btn-blue {
            border-color: #0055ff !important;
            color: #88b0ff !important;
        }
        .btn-blue:hover, .btn-blue:active {
            border-color: #3377ff !important;
            color: #b3ccff !important;
        }
        .btn-blue:active {
            background: #002266 !important;
            box-shadow: 0 0 15px rgba(0, 85, 255, 0.6), inset 0 2px 5px rgba(0,0,0,0.8) !important;
        }

        .btn.speed-btn {
            border-color: #99cc00 !important;
            color: #d2ff4d !important;
        }
        .btn.speed-btn:hover, .btn.speed-btn:active {
            border-color: #bbff00 !important;
            color: #e6ff99 !important;
        }
        .btn.speed-btn:active {
            background: #223300 !important;
            box-shadow: 0 0 15px rgba(153, 204, 0, 0.6), inset 0 2px 5px rgba(0,0,0,0.8) !important;
        }

        .btn.ab-btn {
            border-color: #ff3333 !important;
            color: #ff8888 !important;
        }
        .btn.ab-btn:hover, .btn.ab-btn:active {
            border-color: #ff5555 !important;
            color: #ffb3b3 !important;
        }
        .btn.ab-btn:active {
            background: #550000 !important;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6), inset 0 2px 5px rgba(0,0,0,0.8) !important;
        }
        .btn.ab-btn.active {
            background: linear-gradient(180deg, #440000 0%, #220000 100%) !important;
            color: #fff !important;
            border-color: #ff1a1a !important;
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.7), inset 0 1px 0 rgba(255,255,255,0.2) !important;
        }
        .btn.ab-btn.active:hover {
            background: linear-gradient(180deg, #660000 0%, #330000 100%) !important;
            border-color: #ff4d4d !important;
        }

        .btn.tap-btn {
            border-color: #00ccff !important;
            color: #99eeff !important;
        }
        .btn.tap-btn:hover, .btn.tap-btn:active {
            border-color: #33ddff !important;
            color: #ccf5ff !important;
        }
        .btn.tap-btn:active {
            background: #004455 !important;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.6), inset 0 2px 5px rgba(0,0,0,0.8) !important;
        }

        .btn.metro-btn {
            border-color: #9933ff !important;
            color: #ddbfff !important;
        }
        .btn.metro-btn:hover, .btn.metro-btn:active {
            border-color: #b366ff !important;
            color: #eedfff !important;
        }
        .btn.metro-btn:active, .btn.metro-btn[style*="border-color"] {
            background: #220044 !important;
            border-color: #9933ff !important;
            box-shadow: 0 0 15px rgba(153, 51, 255, 0.6), inset 0 2px 5px rgba(0,0,0,0.8) !important;
        }

        /* ★カメラON/OFFトグル専用ボタン */
        .btn.camera-btn {
            border-color: #444 !important;
            color: #888 !important;
        }
        .btn.camera-btn.active {
            border-color: #00ffcc !important;
            color: #00ffcc !important;
            background: linear-gradient(180deg, #00332c 0%, #001a16 100%) !important;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4) !important;
        }

        .ab-btn { position: relative; }

        .speed-panel {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px dashed #3a3a45;
            gap: 10px;
        }

        .speed-display {
            background: #1a1a1e;
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 11px;
            color: #888;
            text-align: center;
            border: 1px solid #2d2d34;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.6);
            height: 38px;
            overflow: hidden;
            position: relative;
        }
        
        .speed-reel {
            display: flex;
            flex-direction: column;
            position: absolute;
            left: 0;
            right: 0;
            top: 20px;
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .speed-reel-item {
            font-size: 18px;
            color: #d2ff4d;
            font-weight: bold;
            height: 24px;
            line-height: 24px;
            text-shadow: 0 0 10px rgba(153, 204, 0, 0.8);
            opacity: 0;
            transition: opacity 0.2s ease, text-shadow 0.2s ease;
        }
        
        .speed-reel-item.active { opacity: 1; }
        
        .speed-reel-item.default-speed.active {
            color: #d2ff4d;
            text-shadow: 0 0 10px rgba(153, 204, 0, 0.8);
        }

        .speed-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .btn.speed-btn {
            width: 90px;
            height: 27px;
            font-size: 12px;
            border-radius: 3px;
        }

        .tap-panel {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px dashed #3a3a45;
            gap: 10px;
        }

        #bpmInput {
            width: 76px;
            height: 44px;
            background-color: #0c0c0e;
            border: 2px solid #2d2d34;
            border-radius: 6px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 20px;
            font-weight: bold;
            color: #ddbfff;
            text-align: center;
            text-shadow: 0 0 10px rgba(153, 51, 255, 0.8);
            -webkit-appearance: none;
            -moz-appearance: textfield;
            margin: 0;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.9), 0 1px 0px rgba(255, 255, 255, 0.05);
            outline: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        #bpmInput:hover {
            border-color: #444450;
            background-color: #0f0f12;
        }
        #bpmInput:focus {
            border-color: #9933ff;
            background-color: #0f0814;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.9), 0 0 10px rgba(153, 51, 255, 0.3);
            cursor: text;
        }

        #bpmInput::-webkit-outer-spin-button,
        #bpmInput::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .tap-display {
            width: 70px;
            height: 48px;
            background-color: #0d0d0f;
            border: 2px solid #2d2d34;
            border-radius: 4px;
            font-size: 10px;
            color: #666;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }
        .tap-display span {
            font-size: 16px;
            color: #444;
            margin-top: 2px;
            transition: color 0.1s;
        }

        .btn.tap-btn {
            width: 70px;
            height: 48px;
            font-size: 11px;
            border-radius: 6px;
            border-color: #555;
            color: #ccc;
        }
        .btn.tap-btn:hover {
            background: linear-gradient(180deg, #4a4a57 0%, #2f2f38 100%);
            color: #fff;
        }

        .btn.metro-btn {
            width: 80px;
            height: 48px;
            font-size: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }
        
        .metro-led {
            width: 8px;
            height: 8px;
            background-color: #333;
            border-radius: 50%;
            transition: all 0.2s;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }
        
        .metro-led.on { background-color: #990000; }
        .metro-led.flash { transform: scale(1.1); }

        #videoHistorySelect {
            padding: 10px;
            font-size: 13px;
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: #0c0c0e;
            color: #00ccff;
            border: 1px solid #2d2d34;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            max-width: 300px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            transition: border-color 0.2s;
        }
        #videoHistorySelect:hover { border-color: #444450; }
        #videoHistorySelect option {
            background-color: #1a1a1e;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="input-container">
        <input type="text" id="videoIdInput" placeholder="YouTube Video ID or URL">
        <select id="videoHistorySelect" onchange="loadVideoFromHistory()">
            <option value="">-- HISTORY --</option>
        </select>
        <button class="btn" style="width: auto; height: auto;" onclick="loadVideo()">LOAD</button>
    </div>

    <!-- YouTubeプレイヤー ＆ カメラモニター メインエリア -->
    <div class="stage-wrapper">
        
        <!-- 左側：動画 ＋ 動画コントロール -->
        <div class="stage-column video-column">
            <div class="video-container">
                <div id="player"></div>
                <div id="noVideoMsg" class="no-video-message">NO VIDEO LOADED</div>
            </div>
            
            <!-- 動画側コントロール（グレー下地なし、センター合わせ） -->
            <div class="controls">
                <button class="btn btn-blue" onclick="skip(-10)">-10 sec</button>
                <button class="btn btn-blue" id="playPauseBtn" onclick="togglePlay()">Play / Pause</button>
                <button class="btn btn-blue" onclick="skip(10)">+10 sec</button>

                <div class="speed-panel">
                    <div class="speed-display" id="speedDisplay">
                        SPEED
                        <div class="speed-reel" id="speedReel">
                            <div class="speed-reel-item default-speed active">1.0x</div>
                            <div class="speed-reel-item">0.75x</div>
                            <div class="speed-reel-item">0.5x</div>
                        </div>
                    </div>
                    <div class="speed-buttons">
                        <button class="btn speed-btn" style="height: 48px;" onclick="toggleSpeed()">SPEED</button>
                    </div>
                </div>
                
                <button class="btn ab-btn" id="btnA" 
                        onmousedown="startPress('A')" 
                        onmouseup="endPress('A')" 
                        onmouseleave="cancelPress('A')"
                        ontouchstart="startPress('A')" 
                        ontouchend="endPress('A')">A<br><span class="btn-status" style="color: #666;">--:--</span></button>
                        
                <button class="btn ab-btn" id="btnB" 
                        onmousedown="startPress('B')" 
                        onmouseup="endPress('B')" 
                        onmouseleave="cancelPress('B')"
                        ontouchstart="startPress('B')" 
                        ontouchend="endPress('B')">B<br><span class="btn-status" style="color: #666;">--:--</span></button>

                <div class="tap-panel">
                    <button class="btn metro-btn" id="metroBtn" onclick="toggleMetronome()">
                        METRO
                        <span class="metro-led" id="metroLed"></span>
                    </button>
                    <input type="number" id="bpmInput" value="120" min="30" max="300" 
                           oninput="applyBpmFromInput()" 
                           onkeydown="handleBpmEnter(event)">
                    <button class="btn tap-btn" id="tapBtn" onmousedown="tapBPM()">TAP</button>
                </div>
            </div>
        </div>

        <!-- 右側：カメラ映像 ＋ カメラコントロール -->
        <div class="stage-column camera-column">
            <div class="camera-container">
                <video id="webcam" autoplay playsinline muted></video>
                <div class="camera-overlay" id="cameraOverlay">📷 CAMERA OFF</div>
            </div>
            
            <!-- カメラ側コントロール（センター合わせ） -->
            <div class="controls">
                <button class="btn camera-btn" id="cameraToggleBtn" onclick="toggleCamera()">
                    CAMERA<br><span class="btn-status" id="cameraStatusText" style="color: #666;">OFF</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var currentVideoId = null;

        // ループ制御用の変数
        var pointA = null;
        var pointB = null;
        var loopTimer = null;

        var isCountingIn = false;
        
        // 長押し判定用の変数
        var pressTimer = null;
        var isLongPress = false;
        var longPressDuration = 500;

        // カメラ制御用の変数
        var cameraStream = null;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                playerVars: {
                    'playsinline': 1,
                    'controls': 1,
                    'rel': 0
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // Webカメラ起動 / 停止のトグル切り替え処理
        async function toggleCamera() {
            var videoElem = document.getElementById('webcam');
            var overlayElem = document.getElementById('cameraOverlay');
            var btnElem = document.getElementById('cameraToggleBtn');
            var statusElem = document.getElementById('cameraStatusText');

            if (cameraStream) {
                // カメラをオフにする処理
                cameraStream.getTracks().forEach(function(track) { track.stop(); });
                cameraStream = null;
                videoElem.style.display = 'none';
                overlayElem.style.display = 'block';
                btnElem.classList.remove('active');
                statusElem.textContent = 'OFF';
                statusElem.style.color = '#666';
            } else {
                // カメラをオンにする処理
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: { ideal: 720 }, height: { ideal: 1280 } }, 
                        audio: false 
                    });
                    videoElem.srcObject = cameraStream;
                    videoElem.style.display = 'block';
                    overlayElem.style.display = 'none';
                    btnElem.classList.add('active');
                    statusElem.textContent = 'ON';
                    statusElem.style.color = '#00ffcc';
                } catch (err) {
                    alert('Webカメラへのアクセスが拒否されたか、カメラが見つかりませんでした。');
                    console.error(err);
                }
            }
        }

        function togglePlay() {
            if (!player || typeof player.getPlayerState !== 'function') return;
            var state = player.getPlayerState();
            if (state == YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function skip(seconds) {
            if (!player || typeof player.getCurrentTime !== 'function') return;
            var currentTime = player.getCurrentTime();
            var duration = player.getDuration();
            var newTime = currentTime + seconds;

            if (newTime < 0) newTime = 0;
            if (newTime > duration) newTime = duration;

            player.seekTo(newTime, true);
        }

        var videoHistory = [];
        var MAX_HISTORY = 8;

        function loadVideo() {
            var input = document.getElementById('videoIdInput').value.trim();
            if (!input) return;
            
            var videoId = extractVideoId(input);
            
            if (videoId && player && typeof player.loadVideoById === 'function') {
                currentVideoId = videoId;
                player.loadVideoById(videoId);
                document.getElementById('noVideoMsg').style.display = 'none';
                resetLoopSettings();
            } else {
                alert('有効なYouTubeのURLまたは動画IDが見つかりませんでした。');
            }
        }

        function extractVideoId(url) {
            var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            var match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : url;
        }

        function saveToHistory(id, title) {
            if (!id) return;
            var finalTitle = (title && title !== id) ? title : "YouTube Video (" + id + ")";

            for (var i = 0; i < videoHistory.length; i++) {
                if (videoHistory[i].id === id) {
                    if (finalTitle.indexOf("YouTube Video") === 0 && videoHistory[i].title.indexOf("YouTube Video") !== 0) {
                        finalTitle = videoHistory[i].title;
                    }
                    videoHistory.splice(i, 1);
                    break;
                }
            }
            
            videoHistory.unshift({ id: id, title: finalTitle });
            if (videoHistory.length > MAX_HISTORY) videoHistory.pop();
            
            localStorage.setItem('yt_lesson_history', JSON.stringify(videoHistory));
            updateHistorySelect();
        }

        function updateHistorySelect() {
            var select = document.getElementById('videoHistorySelect');
            if (!select) return;
            
            select.innerHTML = '<option value="">-- HISTORY --</option>';
            
            for (var i = 0; i < videoHistory.length; i++) {
                var option = document.createElement('option');
                option.value = videoHistory[i].id;
                
                var displayTitle = videoHistory[i].title;
                if (displayTitle.length > 25) {
                    displayTitle = displayTitle.substring(0, 25) + "...";
                }
                option.textContent = displayTitle;
                
                select.appendChild(option);
            }

            if (videoHistory.length > 0) {
                var clearOption = document.createElement('option');
                clearOption.value = "__CLEAR_ALL__";
                clearOption.textContent = "❌ CLEAR ALL HISTORY";
                clearOption.style.color = "#ff3333";
                select.appendChild(clearOption);
            }
        }

        function loadVideoFromHistory() {
            var select = document.getElementById('videoHistorySelect');
            var selectedId = select.value;
            
            if (selectedId === "__CLEAR_ALL__") {
                if (confirm('すべての視聴履歴を削除しますか？')) {
                    videoHistory = [];
                    localStorage.removeItem('yt_lesson_history');
                    updateHistorySelect();
                    document.getElementById('videoIdInput').value = '';
                } else {
                    select.value = "";
                }
                return;
            }
            
            if (selectedId) {
                document.getElementById('videoIdInput').value = selectedId;
                loadVideo();
            }
        }

        function onPlayerStateChange(event) {
            if (isCountingIn) return;

            if (event.data == YT.PlayerState.PLAYING) {
                if (player && typeof player.getVideoData === 'function') {
                    var videoData = player.getVideoData();
                    var targetId = videoData.video_id || currentVideoId;
                    var targetTitle = videoData.title || targetId;
                    
                    if (targetId) saveToHistory(targetId, targetTitle);
                }
                startLoopCheck();
            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                if (pointA === null || pointB === null) stopLoopCheck();
            }
        }

        function startPress(type) {
            isLongPress = false;
            pressTimer = setTimeout(function() {
                isLongPress = true;
                clearPoint(type);
            }, longPressDuration);
        }

        function endPress(type) {
            if (!pressTimer) return; 
            clearTimeout(pressTimer);
            pressTimer = null;
            
            if (!isLongPress) handleButtonClick(type);
        }

        function cancelPress(type) { clearTimeout(pressTimer); }

        function handleButtonClick(type) {
            if (!player || typeof player.getCurrentTime !== 'function') return;

            var val = (type === 'A') ? pointA : pointB;

            if (val === null) {
                var rawTime = player.getCurrentTime();
                var correctedTime = rawTime - 0.18;
                if (correctedTime < 0) correctedTime = 0;

                if (type === 'A') pointA = correctedTime;
                else pointB = correctedTime;
                
                updateButtonUI(type);

                if (pointA !== null && pointB !== null) startLoopCheck();
            } else {
                player.seekTo(val, true);
            }
        }

        function clearPoint(type) {
            if (type === 'A') {
                pointA = null;
                updateButtonUI('A');
            } else if (type === 'B') {
                pointB = null;
                updateButtonUI('B');
            }
        }

        function updateButtonUI(type) {
            var btn = document.getElementById('btn' + type);
            var val = (type === 'A') ? pointA : pointB;
        
            if (val === null) {
                btn.innerHTML = type + "<br><span class='btn-status' style='color: #666;'>--:--</span>";
                btn.classList.remove('active');
            } else {
                btn.innerHTML = type + "<br><span class='btn-status' style='color: #00ffcc; font-weight: bold; font-size: 14px;'>" + formatTime(val) + "</span>";
                btn.classList.add('active');
            }
        }

        function formatTime(seconds) {
            var m = Math.floor(seconds / 60);
            var s = Math.floor(seconds % 60);
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        var isLoopSequence = false; 

        function startLoopCheck() {
            if (loopTimer) {
                clearInterval(loopTimer);
                loopTimer = null;
            }
            
            loopTimer = setInterval(function() {
                if (!player || typeof player.getCurrentTime !== 'function') return;

                if (pointA !== null && pointB !== null && !isLoopSequence) {
                    var currentTime = player.getCurrentTime();
                    
                    if (currentTime >= 0 && currentTime >= pointB) {
                        isLoopSequence = true; 
                        playPikoSound();
                        
                        startFadeOut(function() {
                            var preRollTime = pointA - 3;
                            if (preRollTime < 0) preRollTime = 0;
                            player.seekTo(preRollTime, true);
                            
                            player.setVolume(0);
                            startFadeIn(function() {
                                isLoopSequence = false;
                            });
                        });
                    }
                }
            }, 100);
        }

        function startFadeOut(callback) {
            var currentVolume = 100;
            var duration = 1000;
            var intervalTime = 50;
            var step = currentVolume / (duration / intervalTime);
            var pElement = document.getElementById('player');
            
            var fadeOutTimer = setInterval(function() {
                if (!player || typeof player.setVolume !== 'function') {
                    clearInterval(fadeOutTimer);
                    if (callback) callback();
                    return;
                }

                currentVolume -= step;
                if (currentVolume <= 0) {
                    player.setVolume(0);
                    if (pElement) pElement.style.opacity = 0;
                    clearInterval(fadeOutTimer);
                    if (callback) callback();
                } else {
                    player.setVolume(Math.round(currentVolume));
                    if (pElement) pElement.style.opacity = (currentVolume / 100);
                }
            }, intervalTime);
        }

        function startFadeIn(callback) {
            var targetVolume = 100;
            var currentVolume = 0;
            var duration = 2000;
            var intervalTime = 50;
            var step = targetVolume / (duration / intervalTime);
            var pElement = document.getElementById('player');
            
            var fadeInTimer = setInterval(function() {
                if (!player || typeof player.setVolume !== 'function') {
                    clearInterval(fadeInTimer);
                    if (callback) callback();
                    return;
                }

                currentVolume += step;
                if (currentVolume >= targetVolume) {
                    player.setVolume(targetVolume);
                    if (pElement) pElement.style.opacity = 1;
                    clearInterval(fadeInTimer);
                    if (callback) callback();
                } else {
                    player.setVolume(Math.round(currentVolume));
                    if (pElement) pElement.style.opacity = (currentVolume / 100);
                }
            }, intervalTime);
        }

        function playPikoSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            var now = audioCtx.currentTime;
            var osc = audioCtx.createOscillator();
            var gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.setValueAtTime(1500, now + 0.04);

            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc.start(now);
            osc.stop(now + 0.09);
        }
        
        function stopLoopCheck() {
            if (loopTimer) {
                clearInterval(loopTimer);
                loopTimer = null;
            }
        }

        function resetLoopSettings() {
            pointA = null;
            pointB = null;
            updateButtonUI('A');
            updateButtonUI('B');
            stopLoopCheck();
        }

        var speedRates = [1.0, 0.75, 0.5];
        var currentSpeedIndex = 0;

        function toggleSpeed() {
            if (!player || typeof player.setPlaybackRate !== 'function') return;
            currentSpeedIndex = (currentSpeedIndex + 1) % speedRates.length;
            applySpeed();
        }

        function applySpeed() {
            var targetSpeed = speedRates[currentSpeedIndex];
            player.setPlaybackRate(targetSpeed);

            var reel = document.getElementById('speedReel');
            if (reel) {
                var offset = currentSpeedIndex * 24;
                reel.style.transform = 'translateY(-' + offset + 'px)';

                var items = reel.getElementsByClassName('speed-reel-item');
                for (var i = 0; i < items.length; i++) {
                    if (i === currentSpeedIndex) items[i].classList.add('active');
                    else items[i].classList.remove('active');
                }
            }
        }
        
        function applyBpmFromInput() {
            var val = parseInt(document.getElementById('bpmInput').value);
            if (val >= 30 && val <= 300) {
                if (isMetroPlaying && audioCtx) nextNoteTime = audioCtx.currentTime; 
            }
        }

        function handleBpmEnter(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('bpmInput').blur();
            }
        }
        
        var tapTimes = [];

        function tapBPM() {
            var now = Date.now();

            if (tapTimes.length > 0 && (now - tapTimes[tapTimes.length - 1] > 3000)) {
                tapTimes = [];
            }

            tapTimes.push(now);

            if (tapTimes.length > 1) {
                var intervals = [];
                for (var i = 1; i < tapTimes.length; i++) {
                    intervals.push(tapTimes[i] - tapTimes[i - 1]);
                }
                
                var avgInterval = intervals.reduce(function(a, b) { return a + b; }) / intervals.length;
                var calculatedBpm = Math.round(60000 / avgInterval);

                if (calculatedBpm >= 30 && calculatedBpm <= 300) {
                    document.getElementById('bpmInput').value = calculatedBpm;
                    if (isMetroPlaying && audioCtx) nextNoteTime = audioCtx.currentTime;
                }
            }

            var tapBtn = document.getElementById('tapBtn');
            tapBtn.style.background = 'linear-gradient(180deg, #555 0%, #333 100%)';
            setTimeout(function() { tapBtn.style.background = ''; }, 50);
        }

        var audioCtx = null;
        var metroTimer = null;
        var isMetroPlaying = false;
        var currentBeat = 0;
        var nextNoteTime = 0.0;
        var scheduleAheadTime = 0.1;
        var lookahead = 25.0;

        function toggleMetronome() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            if (pointA === null && pointB === null && (!player || typeof player.getPlayerState !== 'function' || player.getPlayerState() !== YT.PlayerState.PLAYING)) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            isMetroPlaying = !isMetroPlaying;
            var led = document.getElementById('metroLed');
            var btn = document.getElementById('metroBtn');

            if (isMetroPlaying) {
                var currentBPM = parseInt(document.getElementById('bpmInput').value);
                if (isNaN(currentBPM) || currentBPM < 30 || currentBPM > 300) {
                    currentBPM = 120;
                    document.getElementById('bpmInput').value = 120;
                }

                currentBeat = 0;
                nextNoteTime = audioCtx.currentTime + 0.05;
                scheduler();
                
                led.classList.add('on');
                btn.style.borderColor = '#9933ff';
            } else {
                if (metroTimer) clearTimeout(metroTimer);
                
                activeOscillators.forEach(function(activeOsc) {
                    try { activeOsc.stop(); } catch(e) {}
                });
                activeOscillators = [];

                led.classList.remove('on');
                led.classList.remove('flash');
                btn.style.borderColor = '';
            }
        }

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                scheduleNote(currentBeat, nextNoteTime);
                advanceNote();
            }
            metroTimer = setTimeout(scheduler, lookahead);
        }

        function advanceNote() {
            var currentBPM = parseInt(document.getElementById('bpmInput').value) || 120;
            var secondsPerBeat = 60.0 / currentBPM;
            nextNoteTime += secondsPerBeat;
            currentBeat = (currentBeat + 1) % 4;
        }

        var countInBeats = 0; 
        var activeOscillators = [];

        function scheduleNote(beatNumber, time) {
            if (!isMetroPlaying) return;

            var osc = audioCtx.createOscillator();
            var gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (beatNumber === 0) {
                osc.frequency.setValueAtTime(880, time);
            } else {
                osc.frequency.setValueAtTime(440, time);
            }

            gainNode.gain.setValueAtTime(0.3, time);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

            osc.start(time);
            osc.stop(time + 0.06);

            activeOscillators.push(osc);

            setTimeout(function() {
                var led = document.getElementById('metroLed');
                if (led && isMetroPlaying) {
                    led.classList.add('flash');
                    if (beatNumber === 0) {
                        led.style.background = '#ff3b30';
                        led.style.boxShadow = '0 0 10px #ff3b30';
                    } else {
                        led.style.background = '#00ffcc';
                        led.style.boxShadow = '0 0 10px #00ffcc';
                    }
                    setTimeout(function() {
                        led.classList.remove('flash');
                        if (isMetroPlaying) {
                            led.style.background = '#990000';
                            led.style.boxShadow = 'none';
                        }
                    }, 40);
                }
            }, (time - audioCtx.currentTime) * 1000);

            if (isCountingIn) {
                countInBeats++;
                
                if (countInBeats === 9) {
                    var playDelay = (time - audioCtx.currentTime) * 1000;
                    
                    setTimeout(function() {
                        if (isCountingIn) {
                            isCountingIn = false;
                            countInBeats = 0;
                            
                            activeOscillators.forEach(function(activeOsc) {
                                try { activeOsc.stop(); } catch(e) {}
                            });
                            activeOscillators = [];

                            if (metroTimer) {
                                clearTimeout(metroTimer);
                                metroTimer = null;
                            }
                            isMetroPlaying = false;

                            var led = document.getElementById('metroLed');
                            var btn = document.getElementById('metroBtn');
                            if (led) {
                                led.classList.remove('on');
                                led.classList.remove('flash');
                                led.style.background = '#333';
                                led.style.boxShadow = 'none';
                            }
                            if (btn) btn.style.borderColor = '';
                            
                            currentBeat = 0; 
                            
                            if (player && typeof player.playVideo === 'function') {
                                player.playVideo();
                            }
                        }
                    }, playDelay);
                }
            }
        }

        window.addEventListener('keydown', function(event) {
            if (document.activeElement.tagName === 'INPUT') return;
            if (event.repeat) return;
            
            switch (event.key) {
                case ' ':
                    event.preventDefault();
                    togglePlay();
                    break;
                case 'ArrowLeft':
                    event.preventDefault();
                    skip(-10);
                    break;
                case 'ArrowRight':
                    event.preventDefault();
                    skip(10);
                    break;
                case 'a':
                case 'A':
                    if (!event.repeat && !pressTimer) startPress('A');
                    break;
                case 'b':
                case 'B':
                    if (!event.repeat && !pressTimer) startPress('B');
                    break;
                case 's':
                case 'S':
                    toggleSpeed();
                    break;
                case 't':
                case 'T':
                    tapBPM();
                    break;
                case 'm':
                case 'M':
                    toggleMetronome();
                    break;
                case 'c':
                case 'C':
                    toggleCamera();
                    break;
                default:
                    return;
            }
        });

        window.addEventListener('keyup', function(event) {
            if (document.activeElement.tagName === 'INPUT') return;
        
            switch (event.key) {
                case 'a':
                case 'A':
                    endPress('A');
                    break;
                case 'b':
                case 'B':
                    endPress('B');
                    break;
            }
        });

        window.addEventListener('DOMContentLoaded', function() {
            var storedHistory = localStorage.getItem('yt_lesson_history');
            if (storedHistory) {
                try {
                    videoHistory = JSON.parse(storedHistory);
                    if (!Array.isArray(videoHistory)) videoHistory = [];
                    if (videoHistory.length > 0 && typeof videoHistory[0] === 'string') {
                        videoHistory = [];
                        localStorage.removeItem('yt_lesson_history');
                    }
                } catch(e) {
                    videoHistory = [];
                }
            }
            updateHistorySelect();
        });
    </script>
</body>
